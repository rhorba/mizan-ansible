---
- name: Check that the OS family is supported
  ansible.builtin.assert:
    that: ansible_facts['os_family'] in ['Debian', 'RedHat']
    fail_msg: "Supported: Ubuntu and Rocky/Alma/RHEL 9, got {{ ansible_facts['os_family'] }}"
    quiet: true

- name: Packages, automatic security updates and host firewall for {{ ansible_facts['os_family'] }}
  ansible.builtin.include_tasks: "{{ ansible_facts['os_family'] | lower }}.yml"

- name: Harden sshd
  when: base_harden_ssh | bool
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh
