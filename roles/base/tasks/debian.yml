---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages_debian }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Open host iptables (the VCN security list is the firewall)
  when: base_open_host_iptables | bool
  block:
    - name: Ensure /etc/iptables exists
      ansible.builtin.file:
        path: /etc/iptables
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write permissive rules.v4
      ansible.builtin.template:
        src: rules.v4.j2
        dest: /etc/iptables/rules.v4
        owner: root
        group: root
        mode: "0644"
      notify: Restore iptables
