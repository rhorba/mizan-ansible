---
# Local lab: an Ubuntu 24.04 container started by scripts/lab-up.sh.
# A container has no systemd, host firewall or kernel modules, so the lab proves
# install + idempotency only. Services start on a real VM (inventories/oci).
all:
  children:
    mizan_nodes:
      hosts:
        mizan-lab:
          ansible_connection: community.docker.docker
          ansible_host: mizan-lab
          ansible_become: false  # the container already runs as root, without sudo
          base_open_host_iptables: false
          base_harden_ssh: false
          docker_manage_service: false
          k3s_start: false
        # A real Ubuntu 24.04 VM (Multipass) where services really start.
        # Run scripts/vm-run.sh inside the VM: it targets itself over SSH.
        mizan-vm:
          ansible_host: 127.0.0.1
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
